<div class="card rounded-4 shadow border-0" id="resultsCard">
    <div class="card-header rounded-top-4 bg-info text-white d-flex justify-content-between align-items-center py-3">
        <h3 class="h5 mb-0"><i class="bi bi-lightbulb-fill me-2"></i> Suggerimenti generati</h3>
        <div class="d-flex align-items-center gap-2">
            <span class="badge bg-light text-dark fw-semibold rounded-pill px-3 py-2">
                <i class="bi bi-check2-circle text-success me-1"></i>
                {{ suggestions().length }} {{ suggestions().length === 1 ? 'predizione pronta' : 'predizioni pronte' }}
            </span>
            <button type="button" 
                    class="btn btn-sm btn-outline-light rounded-circle d-flex align-items-center justify-content-center p-0 close-btn" 
                    (click)="close()" 
                    title="Chiudi suggerimenti" 
                    aria-label="Chiudi suggerimenti">
                <i class="bi bi-x-lg"></i>
            </button>
        </div>
    </div>
    <div class="card-body p-4">
        <div class="d-flex flex-column" id="suggestionsList">
            @for (suggest of suggestions(); track $index) {
            <app-suggest [suggest]="suggest" />
            }
        </div>
    </div>
</div>
