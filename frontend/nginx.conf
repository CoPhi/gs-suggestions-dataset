worker_processes 1;
pid /tmp/nginx.pid;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    server {
        listen 4200;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Disabilita la cache su entrypoint HTML, manifest e Service Worker Angular
        # per garantire l'aggiornamento immediato dopo ogni rilascio.
        location ~* ^/(index\.html|ngsw\.json|ngsw-worker\.js|manifest\.webmanifest)$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            try_files $uri =404;
        }

        # Cache aggressiva sui bundle JS/CSS immutabili con hash di build
        location ~* \.(?:js|css|woff2?|ttf|svg|png|ico|webp)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
