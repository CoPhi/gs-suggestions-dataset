program: scripts/opt.py
method: bayes
metric:
  name: eval_composite_score
  goal: maximize
command:
  - ${env}
  - python
  - ${program}
  - "--checkpoint"
  - "CNR-ILC/gs-aristoBERTo"
  - ${args}
parameters:
  lr:
    distribution: log_uniform_values
    min: 5e-6
    max: 5e-5
  epochs:
    values: [3, 4, 5]
  batch_size:
    values: [32, 64]
  chunk_size:
    values: [128, 256]
  num_layers_to_freeze:
    values: [4, 6, 8, 10]
  weight_decay:
    values: [0.001, 0.01, 0.1]
  warmup_ratio:
    values: [0.05, 0.10, 0.15]
  mlm_probability:
    values: [0.10, 0.15, 0.20]
  max_span_length:
    values: [2, 3, 4]
  lr_scheduler_type:
    values: ["linear", "cosine"]
