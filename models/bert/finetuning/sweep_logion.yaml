project: gs-suggestions
program: scripts/opt.py
method: bayes
run_cap: 15
early_terminate:
  type: hyperband
  min_iter: 2
  eta: 3
metric:
  name: eval_composite_score
  goal: maximize
command:
  - ${env}
  - python
  - ${program}
  - "--checkpoint"
  - "CNR-ILC/gs-Logion"
  - ${args}
parameters:
  lr:
    distribution: log_uniform_values
    min: 1e-6
    max: 5e-5
  epochs:
    values: [2, 3, 4]
  batch_size:
    value: 128
  chunk_size:
    values: [128, 256]
  num_layers_to_freeze:
    values: [0, 4, 6, 8, 10]
  weight_decay:
    values: [0.01, 0.1]
  warmup_ratio:
    value: 0.10
  mlm_probability:
    values: [0.10, 0.15, 0.20]
  lr_scheduler_type:
    value: "cosine"
