services:
  gs-api:
    build:
      context: .
    image: gabrielegiannessi/gs-api:latest
    container_name: gs-api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - MONGO_USERNAME=${MONGO_USERNAME}
      - MONGO_PASSWORD=${MONGO_PASSWORD}
      - MONGO_HOST=mongodb
    depends_on:
      mongodb:
        condition: service_healthy   

  frontend:
    build:
      context: ./frontend
    image: gabrielegiannessi/gs-frontend:latest
    container_name: frontend
    ports:
      - "4200:4200"

  mongodb:
    image: mongo:4.4
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s   

volumes:
  mongodb_data: