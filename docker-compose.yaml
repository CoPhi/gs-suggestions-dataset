services:
  gs-api:
    image: gabrielegiannessi/gs-api:latest
    pull_policy: always
    container_name: gs-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MONGO_USERNAME=${MONGO_USERNAME}
      - MONGO_PASSWORD=${MONGO_PASSWORD}
      - MONGO_HOST=mongodb
      - HF_TOKEN=${HF_TOKEN:-}
      - RAG_DEFAULT_LM=${RAG_DEFAULT_LM:-Qwen/Qwen2.5-72B-Instruct}
      - RAG_DEFAULT_BACKEND=${RAG_DEFAULT_BACKEND:-auto}
      - RAG_API_BASE=${RAG_API_BASE:-}
      - RAG_API_KEY=${RAG_API_KEY:-}
      - RAG_LLM_LOG_DEST=${RAG_LLM_LOG_DEST:-stdout}
      - RAG_LLM_LOG_FILE=${RAG_LLM_LOG_FILE:-logs/llm_calls.log}
      - RAG_LLM_LOG_LEVEL=${RAG_LLM_LOG_LEVEL:-INFO}
      - RAG_LLM_LOG_HEADERS=${RAG_LLM_LOG_HEADERS:-safe}
      - RAG_LLM_LOG_PROMPTS=${RAG_LLM_LOG_PROMPTS:-false}
      - RAG_CONVERSATION_LOG_ENABLED=${RAG_CONVERSATION_LOG_ENABLED:-false}
      - RAG_CONVERSATION_LOG_FILE=${RAG_CONVERSATION_LOG_FILE:-logs/dspy_conversations.jsonl}
      - MALLOC_ARENA_MAX=${MALLOC_ARENA_MAX:-2}
      - OMP_NUM_THREADS=${OMP_NUM_THREADS:-4}
      - GS_MAX_BERT_MODELS=${GS_MAX_BERT_MODELS:-1}
      - GS_MODEL_IDLE_TTL_SECONDS=${GS_MODEL_IDLE_TTL_SECONDS:-600}
      - GS_CACHE_SWEEP_INTERVAL_SECONDS=${GS_CACHE_SWEEP_INTERVAL_SECONDS:-60}
      - GS_ITHACA_MICRO_BATCH=${GS_ITHACA_MICRO_BATCH:-4}
    volumes:
      - gs_api_logs:/app/logs
    depends_on:
      mongodb:
        condition: service_healthy   

  frontend:
    image: gabrielegiannessi/gs-frontend:latest
    pull_policy: always
    container_name: gs-frontend
    restart: unless-stopped
    ports:
      - "4200:4200"

  mongodb:
    image: mongo:4.4
    container_name: gs-mongodb
    restart: unless-stopped
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25"]
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s   

volumes:
  mongodb_data:
  gs_api_logs: