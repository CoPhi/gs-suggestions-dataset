[project]
name = "gs-suggestions-dataset"
version = "0.5.0"
description = ""
authors = [{ name = "Gabriele", email = "gabrielegiannessi@gmail.com" }]
requires-python = ">=3.12,<3.13"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "maat",
    "hcb_infilling",
    "nltk>=3.9.1,<4",
    "fastapi>=0.115.11,<0.116",
    "uvicorn>=0.34.0,<0.35",
    "cltk>=1.5.0,<2",
    "pandas>=2.2.3,<3",
    "matplotlib>=3.10.1,<4",
    "datasets>=3.4.1,<4",
    "transformers[torch]>=5.5.4,<6",
    "pymongo>=4.11.3,<5",
    "torch>=2.6.0,<3",
    "bert-score>=0.3.13,<0.4",
    "python-dotenv>=1.1.0,<2",
    "pytest-asyncio>=1.3.0,<2",
    "wandb>=0.26.0,<0.27",
    "requests>=2.31.0",
    "numpy>=1.26.4",
    "scikit-learn>=1.8.0",
    "tqdm>=4.67.3",
    "lxml>=5.4.0",
    "huggingface-hub>=1.10.2",
    "pydantic>=2.12.5",
]

[tool.uv]
package = false

[tool.uv.sources]
maat = { path = "packages/maat", editable = true }
hcb_infilling = { path = "packages/hcb_infilling", editable = true }

[tool.uv.build-backend]
module-name = [
    "backend",
    "models",
]
module-root = ""
namespace = true

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest (>=9.0.2,<10.0.0)"
]

[tool.pytest.ini_options]
pythonpath = [
  "."
]

